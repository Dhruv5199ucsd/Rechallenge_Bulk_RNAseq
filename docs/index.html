<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RNA-seq Gene Explorer</title>
  <style>
    :root {
      --ink: #eef3f8;
      --muted: #9aa8b7;
      --line: #263646;
      --panel: #111a24;
      --page: #08111a;
      --plot: #0c1620;
      --control: #162230;
      --bulk-d0: #4b9ed8;
      --bulk-d2: #e3bd32;
      --bulk-d8: #df7b35;
      --sc-iel: #4f8f6f;
      --sc-lpl: #8e72b8;
      --sc-re: #c4514b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 18px 24px 14px;
      border-bottom: 1px solid var(--line);
      background: #0a141e;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 700;
    }
    main {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      min-height: calc(100vh - 76px);
    }
    aside {
      padding: 16px;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }
    section {
      padding: 18px 22px 26px;
      overflow: auto;
      background: var(--plot);
    }
    label {
      display: block;
      margin: 12px 0 5px;
      font-weight: 650;
    }
    input, select, textarea, button {
      width: 100%;
      font: inherit;
    }
    input, select, textarea {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--control);
      color: var(--ink);
      padding: 8px;
    }
    input::placeholder, textarea::placeholder {
      color: #748496;
    }
    textarea {
      min-height: 84px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }
    button {
      margin-top: 14px;
      border: 1px solid #69a8ca;
      border-radius: 6px;
      background: #2b6f91;
      color: var(--ink);
      padding: 9px 10px;
      cursor: pointer;
      font-weight: 700;
    }
    button.secondary {
      margin-top: 8px;
      border-color: var(--line);
      background: #182637;
    }
    button:disabled {
      cursor: wait;
      opacity: .65;
    }
    .hint, .status {
      color: var(--muted);
      font-size: 12px;
    }
    .status {
      margin-top: 12px;
      white-space: pre-line;
    }
    .plot-wrap {
      min-width: 900px;
    }
    .plot-actions {
      min-width: 900px;
      margin-bottom: 12px;
      text-align: right;
    }
    .plot-actions button {
      width: auto;
      min-width: 126px;
      margin: 0;
      padding: 8px 12px;
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      background: rgba(3, 8, 13, .92);
      padding: 22px;
    }
    .modal.open {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 14px;
    }
    .modal-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .modal-bar button {
      width: auto;
      margin: 0;
      padding: 8px 12px;
    }
    .modal-content {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0a131d;
      padding: 14px;
    }
    .modal-content svg {
      max-width: none;
      width: auto;
    }
    svg {
      display: block;
      max-width: 100%;
      height: auto;
      background: #0a131d;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    svg text { fill: var(--ink); }
    text.axis, .legend text { fill: var(--ink); font-size: 12px; }
    .axis line, .axis path { stroke: var(--ink); shape-rendering: crispEdges; }
    .grid { stroke: #243443; shape-rendering: crispEdges; }
    .title { font-size: 20px; font-weight: 700; }
    .gene-title { font-size: 14px; font-weight: 700; }
    .small { font-size: 11px; fill: var(--muted); }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .plot-wrap { min-width: 760px; }
      .plot-actions { min-width: 760px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>RNA-seq Gene Explorer</h1>
    <div class="hint">Bulk RNA-seq and single-cell pseudobulk expression for all exported genes.</div>
  </header>

  <main>
    <aside>
      <label for="geneSearch">Quick gene</label>
      <input id="geneSearch" list="geneOptions" placeholder="Type a gene symbol, e.g. Klf2">
      <datalist id="geneOptions"></datalist>

      <label for="geneList">Genes to plot</label>
      <textarea id="geneList" placeholder="One gene per line, comma, or space. Leave empty to use the quick gene.">Klf2</textarea>
      <div class="hint">All genes from the bulk matrix and scRNA-seq object are searchable.</div>

      <label for="viewMode">Dataset</label>
      <select id="viewMode">
        <option value="combined">Bulk + sc pseudobulk</option>
        <option value="bulk">Bulk only</option>
        <option value="sc">sc pseudobulk only</option>
      </select>

      <label for="population">Bulk population</label>
      <select id="population">
        <option value="DP">DP</option>
        <option value="DN">DN</option>
      </select>

      <label for="scale">Y scale</label>
      <select id="scale">
        <option value="log">log10(count + 1)</option>
        <option value="linear">linear</option>
      </select>

      <button id="render" disabled>Loading data...</button>
      <div id="status" class="status">Loading static TSV files...</div>
    </aside>

    <section>
      <div class="plot-actions">
        <button id="expandPlot" class="secondary" disabled>Expand plot</button>
      </div>
      <div id="plot" class="plot-wrap"></div>
    </section>
  </main>

  <div id="plotModal" class="modal" aria-hidden="true">
    <div class="modal-bar">
      <button id="closeModal" class="secondary">Close</button>
    </div>
    <div id="modalPlot" class="modal-content"></div>
  </div>

  <script>
    const bulkPath = "data/bulk_all_gene_summary.tsv";
    const scPath = "data/sc_pseudobulk_all_gene_counts.tsv";
    const bulkOrder = ["d0 NR", "d2 OVA", "d8 OVA"];
    const scOrder = ["IEL_memory", "LPL_memory", "rechallenge"];
    const colors = {
      "d0 NR": "#4b9ed8",
      "d2 OVA": "#e3bd32",
      "d8 OVA": "#df7b35",
      "IEL_memory": "#4f8f6f",
      "LPL_memory": "#8e72b8",
      "rechallenge": "#c4514b"
    };

    let bulkRows = [];
    let scRows = [];
    let allGenes = [];

    const statusEl = document.getElementById("status");
    const plotEl = document.getElementById("plot");
    const renderBtn = document.getElementById("render");
    const expandBtn = document.getElementById("expandPlot");
    const modalEl = document.getElementById("plotModal");
    const modalPlotEl = document.getElementById("modalPlot");

    document.getElementById("render").addEventListener("click", render);
    expandBtn.addEventListener("click", expandPlot);
    document.getElementById("closeModal").addEventListener("click", closeModal);
    modalEl.addEventListener("click", event => {
      if (event.target === modalEl) closeModal();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });
    document.getElementById("geneSearch").addEventListener("change", event => {
      document.getElementById("geneList").value = event.target.value;
    });

    loadData();

    async function loadData() {
      try {
        const [bulkText, scText] = await Promise.all([
          fetch(bulkPath).then(checkFetch).then(r => r.text()),
          fetch(scPath).then(checkFetch).then(r => r.text())
        ]);
        bulkRows = parseTable(bulkText);
        scRows = parseTable(scText);
        allGenes = unique([...bulkRows.map(r => r.gene_name), ...scRows.map(r => r.gene_name)]).sort(naturalSort);
        populateGenes(allGenes);
        renderBtn.disabled = false;
        renderBtn.textContent = "Render plot";
        statusEl.textContent = `${bulkRows.length.toLocaleString()} bulk summary rows\n${scRows.length.toLocaleString()} sc pseudobulk rows\n${allGenes.length.toLocaleString()} searchable gene symbols`;
        render();
      } catch (error) {
        statusEl.textContent = `Could not load static data files.\nUse a local web server or GitHub Pages, not a file:// URL.\n${error.message}`;
        renderBtn.textContent = "Data unavailable";
      }
    }

    function checkFetch(response) {
      if (!response.ok) throw new Error(`${response.url} returned ${response.status}`);
      return response;
    }

    function parseTable(text) {
      const lines = text.trim().split(/\r?\n/);
      const headers = lines.shift().split("\t");
      return lines.map(line => {
        const values = line.split("\t");
        const row = {};
        headers.forEach((header, i) => row[header] = values[i] ?? "");
        return row;
      });
    }

    function populateGenes(genes) {
      const list = document.getElementById("geneOptions");
      const fragment = document.createDocumentFragment();
      genes.forEach(gene => fragment.appendChild(new Option(gene, gene)));
      list.replaceChildren(fragment);
    }

    function selectedGenes() {
      const raw = document.getElementById("geneList").value || document.getElementById("geneSearch").value;
      const requested = raw.split(/[\s,;]+/).map(g => g.trim()).filter(Boolean);
      if (!requested.length) return [];
      const available = new Set(allGenes);
      return unique(requested).filter(gene => available.has(gene));
    }

    function render() {
      const genes = selectedGenes();
      if (!genes.length) {
        plotEl.innerHTML = "<p>No selected genes were found in the loaded datasets.</p>";
        return;
      }
      const mode = document.getElementById("viewMode").value;
      const panels = [];
      genes.forEach(gene => {
        if (mode !== "sc") panels.push({ dataset: "bulk", gene });
        if (mode !== "bulk") panels.push({ dataset: "sc", gene });
      });
      drawPanels(panels);
    }

    function drawPanels(panels) {
      const panelW = 290;
      const panelH = 240;
      const left = 164;
      const top = 176;
      const gap = 58;
      const bottom = 138;
      const width = Math.max(980, left + panels.length * panelW + Math.max(0, panels.length - 1) * gap + 56);
      const height = top + panelH + bottom;
      const svg = makeSvg(width, height);
      const scaleMode = document.getElementById("scale").value;
      const allValues = panels.flatMap(panel => panelValues(panel).map(v => v.mean + v.sem + 1));
      const yMax = Math.max(1, ...allValues);
      const y = makeY(top, panelH, yMax, scaleMode);

      svg.appendChild(text(width / 2, 38, "Gene expression", "title", "middle"));
      svg.appendChild(text(28, top + panelH / 2, scaleMode === "log" ? "normalized count + 1, log scale" : "normalized count", "small", "middle", -90));

      panels.forEach((panel, panelIndex) => {
        const x0 = left + panelIndex * (panelW + gap);
        const values = panelValues(panel);
        const labels = panel.dataset === "bulk" ? bulkOrder : scOrder;
        const subtitle = panel.dataset === "bulk"
          ? `Bulk ${document.getElementById("population").value}`
          : "sc pseudobulk";

        svg.appendChild(text(x0 + panelW / 2, top - 46, panel.gene, "gene-title", "middle"));
        svg.appendChild(text(x0 + panelW / 2, top - 26, subtitle, "small", "middle"));
        drawYAxis(svg, x0, top, panelW - 18, panelH, y, yMax, scaleMode);

        labels.forEach((label, i) => {
          const row = values.find(v => v.label === label);
          const cx = x0 + 74 + i * 78;
          const barW = 34;
          if (row) {
            const barTop = y(row.mean + 1);
            svg.appendChild(rect(cx - barW / 2, barTop, barW, top + panelH - barTop, colors[label], "#0b1118"));
            if (row.sem > 0) {
              const low = y(Math.max(row.mean - row.sem, 0) + 1);
              const high = y(row.mean + row.sem + 1);
              svg.appendChild(line(cx, low, cx, high, "#e9eef5", 1.4));
              svg.appendChild(line(cx - 6, low, cx + 6, low, "#e9eef5", 1.4));
              svg.appendChild(line(cx - 6, high, cx + 6, high, "#e9eef5", 1.4));
            }
            const note = panel.dataset === "bulk" ? `n=${row.n}` : `${row.n.toLocaleString()} cells`;
            svg.appendChild(text(cx, top + panelH + 70, note, "small", "middle"));
          }
          const labelLines = label.split(/[ _]/);
          svg.appendChild(text(cx, top + panelH + 30, labelLines[0], "axis", "middle"));
          if (labelLines[1]) svg.appendChild(text(cx, top + panelH + 48, labelLines.slice(1).join(" "), "axis", "middle"));
        });
      });

      plotEl.replaceChildren(svg);
      expandBtn.disabled = false;
    }

    function expandPlot() {
      const svg = plotEl.querySelector("svg");
      if (!svg) return;
      const clone = svg.cloneNode(true);
      clone.setAttribute("width", Math.round(Number(svg.getAttribute("width")) * 1.35));
      clone.setAttribute("height", Math.round(Number(svg.getAttribute("height")) * 1.35));
      modalPlotEl.replaceChildren(clone);
      modalEl.classList.add("open");
      modalEl.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      modalEl.classList.remove("open");
      modalEl.setAttribute("aria-hidden", "true");
      modalPlotEl.replaceChildren();
    }

    function panelValues(panel) {
      if (panel.dataset === "bulk") {
        const population = document.getElementById("population").value;
        return bulkRows
          .filter(row => row.gene_name === panel.gene && row.population === population)
          .map(row => ({
            label: row.time_condition,
            mean: Number(row.mean_normalized_count),
            sem: Number(row.sem_normalized_count),
            n: Number(row.n_samples)
          }));
      }
      return scRows
        .filter(row => row.gene_name === panel.gene)
        .map(row => ({
          label: row.condition,
          mean: Number(row.normalized_count),
          sem: 0,
          n: Number(row.n_cells)
        }));
    }

    function makeY(top, panelH, maxValue, scaleMode) {
      if (scaleMode === "linear") {
        return value => top + panelH - (value / maxValue) * panelH;
      }
      const logMax = Math.log10(Math.max(10, maxValue));
      return value => top + panelH - (Math.log10(Math.max(1, value)) / logMax) * panelH;
    }

    function drawYAxis(svg, x0, top, width, panelH, y, maxValue, scaleMode) {
      const ticks = scaleMode === "linear" ? linearTicks(maxValue) : logTicks(maxValue);
      ticks.forEach(value => {
        const yy = y(value);
        svg.appendChild(line(x0 - 4, yy, x0, yy, "#9aa8b7", 1));
        svg.appendChild(text(x0 - 7, yy + 4, tickLabel(value, scaleMode), "small", "end"));
      });
    }

    function logTicks(maxValue) {
      const maxPow = Math.ceil(Math.log10(Math.max(10, maxValue)));
      const ticks = [];
      for (let p = 0; p <= maxPow; p++) ticks.push(10 ** p);
      return ticks;
    }

    function linearTicks(maxValue) {
      const step = niceNumber(maxValue / 4);
      const ticks = [];
      for (let value = 0; value <= maxValue + step; value += step) ticks.push(value);
      return ticks;
    }

    function tickLabel(value, scaleMode) {
      if (scaleMode === "log") return value === 1 ? "1" : `10^${Math.round(Math.log10(value))}`;
      return value >= 1000 ? `${Math.round(value / 1000)}k` : String(Math.round(value));
    }

    function niceNumber(value) {
      const exponent = Math.floor(Math.log10(value || 1));
      const fraction = value / (10 ** exponent);
      const niceFraction = fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10;
      return niceFraction * (10 ** exponent);
    }

    function makeSvg(width, height) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("width", width);
      svg.setAttribute("height", height);
      return svg;
    }
    function text(x, y, value, cls, anchor = "start", rotate = 0) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "text");
      el.setAttribute("x", x);
      el.setAttribute("y", y);
      el.setAttribute("class", cls || "");
      el.setAttribute("text-anchor", anchor);
      if (rotate) el.setAttribute("transform", `rotate(${rotate} ${x} ${y})`);
      el.textContent = value;
      return el;
    }
    function rect(x, y, width, height, fill, stroke) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      el.setAttribute("x", x);
      el.setAttribute("y", y);
      el.setAttribute("width", width);
      el.setAttribute("height", Math.max(0, height));
      el.setAttribute("fill", fill);
      el.setAttribute("stroke", stroke || "none");
      return el;
    }
    function line(x1, y1, x2, y2, stroke, width) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", "line");
      el.setAttribute("x1", x1);
      el.setAttribute("y1", y1);
      el.setAttribute("x2", x2);
      el.setAttribute("y2", y2);
      el.setAttribute("stroke", stroke);
      el.setAttribute("stroke-width", width);
      return el;
    }
    function unique(values) {
      return [...new Set(values.filter(Boolean))];
    }
    function naturalSort(a, b) {
      return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
    }
  </script>
</body>
</html>
